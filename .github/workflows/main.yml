name: Run Telegram Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Ye line "Run Workflow" button dalati hai
  schedule:
    # Har 50 minute baad restart karega taaki 60 min limit se pehle update ho jaye
    - cron: '*/50 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py
